name: Supabase keepalive

on:
  schedule:
    # Every 2 days at 09:00 UTC. Supabase pauses projects after a period without API activity.
    - cron: "0 9 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Insert and delete a keepalive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets are required." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/run_keepalive_ping" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
